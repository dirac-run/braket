name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: TypeScript build and tests
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package:smoke
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Rust build and tests
        working-directory: rust
        run: |
          cargo +stable fmt --check
          cargo +stable test --offline --locked
          cargo +stable test --offline --locked --release
          cargo +stable build --offline --locked --release --bin classify-batch
      - name: Data and implementation parity
        run: python3 scripts/verify-parity.py
